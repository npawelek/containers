---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Failure

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.run_attempt > 1
    name: Open Issue
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Open or Update Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ github.repository_owner }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          body="Release failed again after its automatic retry.

          **Commit**: ${HEAD_SHA:0:7} ${HEAD_TITLE}
          **Run**: ${RUN_URL}"
          number="$(gh issue list --label release-failure --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh label create release-failure --color d73a4a --description "Release workflow failed" --force
            gh issue create --title "Release failed" --label release-failure --assignee "${ASSIGNEE}" --body "${body}"
          fi
